name: Make a Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    container: registry.suse.com/bci/bci-base:15.7
    steps:
      - name: setup path
        shell: bash
        run: echo "PATH=$PATH" >> $GITHUB_PATH
      - name: install dependencies
        shell: bash
        run: zypper --non-interactive install git jq
      - name: Git safe directory
        run: git config --global --add safe.directory "$PWD"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'
      - name: Setup goreleaser
        shell: bash
        env:
          GORELEASER_VERSION: v2.15.2
          GORELEASER_CHECKSUM_x86_64: 0ebdbf0353aba566b969dde746cc4e4806f96c27aa2f3971b229a9df7611fedc
        run: |-
          OS="Linux"
          if [[ ${RUNNER_OS} != "Linux" ]]; then
          	echo "Unsupported OS: ${RUNNER_OS}"
          	exit 1
          fi

          ARCH=$(uname -m)
          CHECKSUM="${GORELEASER_CHECKSUM_x86_64}"
          if [[ "${ARCH}" != "x86_64" ]]; then
          	echo "Unsupported architecture: ${ARCH}"
          	exit 1
          fi

          FILE="goreleaser_${OS}_${ARCH}.tar.gz"

          echo "Installing ${FILE}"
          curl -LO "https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}/${FILE}"
          echo "${CHECKSUM} ${FILE}" | sha256sum -c
          tar -xf "${FILE}" goreleaser

          if sudo -l &> /dev/null; then
          	sudo install -m 755 goreleaser /usr/local/bin/goreleaser
          else
          	install -m 755 goreleaser /usr/local/bin/goreleaser
          fi
          rm -f "${FILE}" goreleaser

      - name: Run goreleaser
        id: goreleaser
        shell: bash
        run: |-
          goreleaser release
          echo "metadata=$(tr -d '\n\r' < dist/metadata.json)" >> "${GITHUB_OUTPUT}"
          echo "artifacts=$(tr -d '\n\r' < dist/artifacts.json)" >> "${GITHUB_OUTPUT}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Use metadata
        shell: bash
        env:
          METADATA: ${{ steps.goreleaser.outputs.metadata }}
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
        run: |
          echo "metadata: ${METADATA}"
          echo "version: $(echo "${METADATA}" | jq -r '.version')"
          echo "artifacts: ${ARTIFACTS}"
          echo "artifacts 1: $(echo "${METADATA}" | jq -r '.[0].name')"
